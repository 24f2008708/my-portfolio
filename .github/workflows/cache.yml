name: Cache Workflow

on:
  push:
  workflow_dispatch:

jobs:
  cache-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare cache folder
        run: mkdir -p cache-folder

      - name: Cache dependencies
        id: cache_step
        uses: actions/cache@v4
        with:
          path: cache-folder
          key: cache-db92560

      - name: prime-cache-db92560
        run: echo Cache hit: ${{ steps.cache_step.outputs.cache-hit }}
